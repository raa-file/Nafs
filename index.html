:root{
  --indigo:#3B2380; --indigo-d:#281660; --indigo-l:#6B52B8;
  --orange:#EE7F1F; --orange-l:#FFF1E3;
  --teal:#1F9DB5; --teal-l:#E3F5F8;
  --green:#2FA35B; --green-l:#E5F6EC;
  --red:#D6455A; --red-l:#FDECEF;
  --mist:#F5F3FB; --line:#E3DEF1; --ink:#241A4D; --muted:#6F6992; --white:#fff;
  --r:18px; --r-s:12px;
  --shadow:0 1px 2px rgba(36,26,77,.06),0 6px 18px rgba(36,26,77,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--mist);line-height:1.7;font-size:16px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.wrap.wide{max-width:1000px}

/* ---------- login ---------- */
.login{min-height:100vh;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
.orbit{position:absolute;inset:0 0 auto 0;height:380px;pointer-events:none}
.login .top{position:relative;text-align:center;padding:34px 16px 6px}
.login .top img{width:150px;height:auto;display:block;margin:0 auto}
.login h1{margin:6px 0 2px;font-size:34px;font-weight:700;color:var(--indigo);letter-spacing:-.3px;line-height:1.3}
.login .sub{margin:0;color:var(--muted);font-size:14px}
.login .card{position:relative;margin:20px auto 0;width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--mist);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{background:#fff;color:var(--indigo);box-shadow:0 1px 3px rgba(36,26,77,.12)}
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-size:13px;font-weight:600;color:var(--indigo);margin-bottom:4px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-s);padding:11px 13px;font-size:16px}
.in:focus{border-color:var(--indigo-l);outline:none;box-shadow:0 0 0 3px rgba(107,82,184,.18)}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:16px;background:var(--indigo);color:#fff;width:100%;transition:transform .12s,background .15s}
.btn:hover{background:var(--indigo-d)}
.btn:active{transform:scale(.98)}
.btn.orange{background:var(--orange)} .btn.orange:hover{background:#d96f13}
.btn.ghost{background:#fff;color:var(--indigo);border:1.5px solid var(--line)} .btn.ghost:hover{background:var(--mist)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:11px}
.btn.danger{background:var(--red)} 
.btn[disabled]{opacity:.5;cursor:not-allowed}
.err{background:var(--red-l);color:#9c2438;border-radius:10px;padding:9px 12px;font-size:14px;margin:0 0 12px}
.login .foot{margin-top:auto;padding:22px 16px 26px;text-align:center;color:var(--muted);font-size:13px;position:relative}
.blank{display:inline-block;min-width:110px;border-bottom:2px dotted var(--muted);height:1.1em;vertical-align:-2px}

/* ---------- top bar ---------- */
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar .in2{display:flex;align-items:center;gap:10px;padding:10px 0}
.bar img{width:46px;height:auto}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;color:var(--indigo);font-size:17px;line-height:1.3}
.bar .ttl small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--indigo);flex:none}
.ico:hover{background:var(--mist)}
.ico svg{width:20px;height:20px}

/* ---------- map ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--indigo);line-height:1.2}
.stat small{font-size:12px;color:var(--muted)}
.meter{height:8px;background:#E7E2F4;border-radius:99px;overflow:hidden;margin:10px 0 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:99px;transition:width .5s}
.trail{position:relative;margin:8px auto 40px;direction:ltr}
.trail>svg{position:absolute;inset:0;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:20px;padding:0;box-shadow:var(--shadow)}
.node svg{width:24px;height:24px}
.node.done{background:var(--green);border-color:var(--green);color:#fff}
.node.cur{background:var(--orange);border-color:var(--orange);color:#fff;width:66px;height:66px;font-size:24px}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--orange);opacity:.45;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.node.lock{background:#fff;cursor:not-allowed}
.node.summit{width:84px;height:84px;background:#fff;border-color:var(--line);color:var(--muted)}
.node.summit.done{background:linear-gradient(145deg,var(--orange),#f5a54a);border-color:var(--orange);color:#fff}
.node.summit svg{width:36px;height:36px}
.car{position:absolute;left:0;top:0;width:34px;height:58px;z-index:3;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(36,26,77,.25));will-change:transform}
.car svg{display:block}
.start{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted);direction:rtl}
.lbl{position:absolute;transform:translateY(-50%);width:118px;direction:rtl;font-size:12.5px;line-height:1.45;color:var(--ink)}
.lbl b{display:block;font-size:13px;color:var(--indigo)}
.lbl.l{text-align:right} .lbl.r{text-align:left}
.lbl.dim{opacity:.55}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:12px;height:12px}

/* ---------- station ---------- */
.seg{display:flex;gap:4px;margin:12px 0 0}
.seg i{flex:1;height:6px;border-radius:9px;background:#E3DEF1}
.seg i.ok{background:var(--green)} .seg i.now{background:var(--indigo)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 16px;margin:14px 0 110px}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qnum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.qtext{margin:0;font-size:18px;font-weight:600;line-height:1.75}
.media{margin:14px 0 4px;text-align:center}
.media img{max-width:100%;max-height:260px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.qemoji{font-size:42px;margin:10px 0 0;text-align:center;letter-spacing:6px}
table.qt{width:100%;border-collapse:collapse;margin:14px 0 2px;font-size:15px}
table.qt th{background:var(--indigo);color:#fff;font-weight:600;padding:7px 8px}
table.qt td{border:1px solid var(--line);padding:7px 8px;text-align:center;background:#fff}
table.qt th:first-child{border-top-right-radius:10px} table.qt th:last-child{border-top-left-radius:10px}
.qbox{margin:14px 0 2px;border:1.5px solid var(--indigo-l);border-radius:14px;padding:10px 14px 8px;background:var(--mist)}
.qbox b{color:var(--indigo)} .qbox ul{margin:6px 0 2px;padding-right:20px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 12px;font-size:16.5px;line-height:1.6;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--indigo-l);background:var(--mist)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt .lt{flex:none;width:34px;height:34px;border-radius:50%;background:var(--mist);color:var(--indigo);display:grid;place-items:center;font-weight:700;border:1.5px solid var(--line)}
.opt.ok{border-color:var(--green);background:var(--green-l)} .opt.ok .lt{background:var(--green);color:#fff;border-color:var(--green)}
.opt.no{border-color:#F1B9C2;background:var(--red-l);color:#8c2a3a;text-decoration:line-through;text-decoration-color:rgba(214,69,90,.5)} .opt.no .lt{background:var(--red);color:#fff;border-color:var(--red)}
.opt.no{animation:nudge .32s}
@keyframes nudge{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.opt[disabled]{cursor:default}

function h53(str, seed = 7){ let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);

/* دمج نسختين من تقدّم الطالبة: الأعلى تقدّمًا يبقى، إلا ما أعادت المعلمة تعيينه */
function mergeRec(a, b){

  const out = Object.assign({}, a.updated >= b.updated ? a : b);
  out.rs = rs; out.created = Math.min(a.created || Infinity, b.created || Infinity); out.st = {};
  new Set([...Object.keys(pa), ...Object.keys(pb)]).forEach(i => {
    const x = pa[i], y = pb[i];
    if (!x || !y) { out.st[i] = JSON.parse(JSON.stringify(x || y)); return; }
    const n = Math.max(x.q.length, y.q.length), q = [];
    for (let k = 0; k < n; k++) { const p = x.q[k] || { w: 0, ok: 0 }, r = y.q[k] || { w: 0, ok: 0 }; q.push({ ok: (p.ok || r.ok) ? 1 : 0, w: Math.max(p.w || 0, r.w || 0) }); }
    out.st[i] = { q }; const d = x.d || y.d; if (d) out.st[i].d = d;
  });

}

  };

}

  '<div style="display:flex;justify-content:space-between;margin-top:6px"><span class="sync">السؤال ' + ar(qi + 1) + " من " + ar(st.q.length) + '</span><span class="sync" id="sync"></span></div>' +
  '<article class="qcard"><div class="qhead"><span class="qnum">' + ar(qi + 1) + '</span><h2 class="qtext">' + esc(q.q) + "</h2></div>" + media +
  '<div class="opts" id="opts">' + q.o.map((t, k) => '<button class="opt" data-k="' + k + '"><span class="lt">' + LETTERS[k] + "</span><span>" + esc(t) + "</span></button>").join("") + "</div>" +
  '<div id="fb" aria-live="polite"></div></article></main>' +
  '<div class="dock" id="dock" hidden><button class="btn" id="nx">' + (last ? "إنهاء المحطة" : "السؤال التالي") + "</button></div>";
  document.getElementById("bk").onclick = () => go(viewMap);
  document.getElementById("lo").onclick = logout;
  paintSync();
  const img = document.getElementById("qimg"); if (img) img.onclick = () => zoom(img.src);
  const opts = [...document.querySelectorAll(".opt")];
  const markOk = k => { opts[k].classList.add("ok"); opts.forEach(o => o.disabled = true); };
  if (s.q[qi].ok) { markOk(q.a); document.getElementById("dock").hidden = false; }   // مراجعة سؤال محلول سابقًا
  opts.forEach(o => o.onclick = () => {
    const k = +o.dataset.k, fb = document.getElementById("fb");
    if (k === q.a){
      s.q[qi].ok = 1; markOk(k); saveRec(me);
      fb.innerHTML = '<div class="fb good">' + PRAISE[(qi + i) % PRAISE.length] + "</div>";
      const dock = document.getElementById("dock"); dock.hidden = false; document.getElementById("nx").focus({ preventScroll: true });
      dock.scrollIntoView({ block: "nearest" });
    } else {
      s.q[qi].w++; wrongSet.add(k); o.classList.add("no"); o.disabled = true; saveRec(me);
      fb.innerHTML = '<div class="fb bad">ليست الإجابة الصحيحة، فكّري مرة أخرى وجرّبي خيارًا آخر.</div>';
    }
  });
  document.getElementById("nx").onclick = () => {
    if (!last) { wrongSet = new Set(); go(renderQ, i, qi + 1, false); return; }
    const nxt = stOf(me, i).q.findIndex(x => !x.ok);
    if (nxt >= 0) go(renderQ, i, nxt, false);
    else { const sm = stSummary(me, i); if (!me.st[i].d) { me.st[i].d = Date.now(); saveRec(me); } go(viewDone, i); }
  };
}
const PRAISE = ["إجابة صحيحة، أحسنتِ!", "ممتاز! تفكيركِ سليم.", "صحيح، واصلي بنفس الحماس.", "رائع، ما شاء الله!", "هذا هو الجواب الصحيح، أبدعتِ!"];
function zoom(src){ const d = document.createElement("div"); d.className = "lightbox"; d.innerHTML = '<img src="' + src + '" alt="">'; d.onclick = () => d.remove(); document.body.appendChild(d); }

/* ===================== إتمام المحطة ===================== */
function viewDone(i){
  const s = stSummary(me, i), n = starCount(s), last = i === N - 1;
  $app.innerHTML = topBar("المحطة " + ar(i + 1), esc(STATIONS[i].t), true) +
  '<main class="wrap fin"><div class="badge">' + I.check + "</div><h2>أتممتِ المحطة " + ar(i + 1) + '</h2><p class="sub" style="color:var(--muted);margin:0">كل الإجابات صحيحة، والمحطة التالية انفتحت وسيارتكِ ستتحرك إليها</p>' +
  '<div class="starrow" aria-label="' + ar(n) + ' نجوم">' + [0,1,2].map(k => I.star(k < n ? "#EE7F1F" : "#E3DEF1").replace("<svg", '<svg class="' + (k < n ? "on" : "off") + '" style="animation-delay:' + (0.25 + k * 0.28) + 's"')).join("") + "</div>" +
  '<div class="res"><span>من أول محاولة: ' + ar(s.first) + " من " + ar(s.n) + "</span><span>محاولات خاطئة: " + ar(s.wrong) + "</span></div>" +
  '<div class="quote">' + PHRASES[i] + "</div>" +
  '<div class="stack">' + '<button class="btn orange" id="go">' + (last ? "قودي سيارتكِ إلى القمة" : "تحرّكي إلى المحطة التالية") + "</button>" +
  '<button class="btn ghost" id="mp">العودة إلى الخريطة</button></div></main>';
  document.getElementById("bk").onclick = () => go(viewMap);
  document.getElementById("lo").onclick = logout;
  document.getElementById("mp").onclick = () => go(viewMap);
  document.getElementById("go").onclick = () => go(viewMap);
}
function viewSummit(){
  const S = recSummary(me);
  $app.innerHTML = topBar("قمة العُلا", esc(me.name) + " · " + esc(me.cls), true) +
  '<main class="wrap fin"><div class="badge" style="border-color:var(--orange);background:var(--orange-l)"><svg viewBox="0 0 24 24" fill="none" stroke="#EE7F1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg></div>' +
  "<h2>وصلتِ إلى قمة العُلا!</h2>" +
  '<div class="res" style="margin-top:8px"><span>' + ar(S.solved) + " سؤالًا محلولًا</span><span>الإتقان من أول محاولة: " + ar(S.acc) + "٪</span></div>" +
  '<div class="quote">' + PHRASES[N - 1] + "<br><small style=\"font-weight:400;color:var(--muted);font-size:14px\">" + esc(me.name) + " · " + teacherLine() + "</small></div>" +
  '<div class="stack"><button class="btn ghost" id="mp">العودة إلى الخريطة</button></div></main>';
  document.getElementById("bk").onclick = () => go(viewMap);
  document.getElementById("lo").onclick = logout;
  document.getElementById("mp").onclick = () => go(viewMap);
}

/* ===================== لوحة المعلمة ===================== */
let T = { rows: [], q: "", cls: "", sort: "recent", open: null, src: "", err: "", at: 0, timer: 0 };
async function loadTeacher(){
  let rows = [], src = "local";
  if (remoteOn()) { try { rows = await sb.all(); src = "remote"; T.err = ""; T.at = Date.now(); } catch(e){ rows = Object.values(localAll()); src = "remote-fail"; T.err = e.message || ""; } }
  else rows = Object.values(localAll());
  T.rows = rows; T.src = src;
}
async function viewTeacher(){
  $app.innerHTML = '<div class="empty">جارٍ تحميل النتائج…</div>';
  await loadTeacher(); renderTeacher();
  if (!T.timer) T.timer = setInterval(async () => { const a = document.activeElement; if (!document.getElementById("rf") || (a && a.id === "sq")) return; await loadTeacher(); if (document.getElementById("rf")) renderTeacher(); }, 30000);
}
function renderTeacher(){
  const q = normName(T.q);
  let list = T.rows.map(r => ({ r, S: recSummary(r) })).filter(x => (!T.cls || x.r.cls === T.cls) && (!q || normName(x.r.name).includes(q)));
  const sorters = {
    recent: (a, b) => b.r.updated - a.r.updated,
    name: (a, b) => a.r.name.localeCompare(b.r.name, "ar"),
    prog: (a, b) => b.S.solved - a.S.solved,
    acc: (a, b) => (b.S.acc ?? -1) - (a.S.acc ?? -1),
    low: (a, b) => (a.S.acc ?? 101) - (b.S.acc ?? 101)
  };
  list.sort(sorters[T.sort]);
  const all = T.rows.map(recSummary);
  const done = all.filter(s => s.done === N).length;
  const avgP = all.length ? Math.round(all.reduce((a, s) => a + s.solved, 0) / all.length / TOTAL_Q * 100) : 0;
  const accs = all.filter(s => s.acc !== null); const avgA = accs.length ? Math.round(accs.reduce((a, s) => a + s.acc, 0) / accs.length) : null;
  const classes = [...new Set([...CONFIG.classes, ...T.rows.map(r => r.cls)])];
  const noteHtml = T.src === "local" ? '<div class="note warn">تُعرض هنا نتائج الطالبات المحفوظة على هذا الجهاز فقط. لعرض نتائج جميع الطالبات من أي جهاز، فعّلي الربط بقاعدة البيانات كما في ملف «آلية عمل الموقع».</div>' :
    T.src === "remote-fail" ? '<div class="note warn">تعذّر الاتصال بقاعدة البيانات' + (T.err ? " (رمز الخطأ: " + esc(T.err) + ")" : "") + '، وتُعرض البيانات المحفوظة على هذا الجهاز. تأكدي من الإنترنت ومن بيانات الربط.</div>' :
    '<div class="note">النتائج مباشرة من قاعدة البيانات المشتركة · عدد السجلات: ' + ar(T.rows.length) + ' · آخر تحديث ' + new Date(T.at || Date.now()).toLocaleTimeString("ar-EG", { hour: "numeric", minute: "2-digit" }) + '</div>' + (T.rows.length === 0 ? '<div class="note warn">لا توجد سجلات في قاعدة البيانات حتى الآن. إن كانت الطالبات قد سجّلن فعلًا فتأكدي من تنفيذ كود الجدول والسياسة في سوبابيس، وأن الطالبات يفتحن أحدث نسخة من الرابط.</div>' : "");
  $app.innerHTML =
  '<header class="bar"><div class="wrap wide"><div class="in2"><img src="' + LOGO + '" alt=""><div class="ttl"><b>لوحة المعلمة</b><small>' + (CONFIG.schoolName ? schoolLine() + " · " : "") + teacherLine() + '</small></div>' +
  '<button class="ico" id="rf" aria-label="تحديث" title="تحديث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9M20 4v5h-5"/></svg></button>' +
  '<button class="ico" id="lo" aria-label="خروج">' + I.out + "</button></div></div></header>" +
  '<main class="wrap wide" style="padding-bottom:50px">' +
  '<div class="kpis"><div class="kpi"><b>' + ar(T.rows.length) + "</b><small>طالبة مسجّلة</small></div>" +
  '<div class="kpi"><b>' + ar(done) + "</b><small>وصلن إلى القمة</small></div>" +
  '<div class="kpi"><b>' + ar(avgP) + "٪</b><small>متوسط التقدّم</small></div>" +
  '<div class="kpi"><b>' + (avgA === null ? "—" : ar(avgA) + "٪") + "</b><small>متوسط الإتقان من أول محاولة</small></div></div>" + noteHtml +
  '<div class="tools"><input class="in" id="sq" type="search" placeholder="ابحثي باسم الطالبة" value="' + esc(T.q) + '">' +
  '<select class="in" id="sc"><option value="">كل الفصول</option>' + classes.map(c => "<option" + (T.cls === c ? " selected" : "") + ">" + esc(c) + "</option>").join("") + "</select>" +
  '<select class="in" id="ss">' + [["recent","الأحدث نشاطًا"],["name","الاسم"],["prog","الأكثر تقدّمًا"],["acc","الأعلى إتقانًا"],["low","الأقل إتقانًا (تحتاج دعمًا)"]].map(o => '<option value="' + o[0] + '"' + (T.sort === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>" +
  '<button class="btn ghost sm" id="csv">تصدير الجدول</button></div>' +
  (list.length ? '<div class="hdr"><span>الطالبة</span><span>الفصل</span><span>التقدّم</span><span style="text-align:center">الإتقان</span></div>' : "") +
  '<div id="list">' + (list.length ? list.map(x => stuHtml(x)).join("") : '<div class="empty">لا توجد نتائج لعرضها بعد.</div>') + "</div></main>";
  document.getElementById("lo").onclick = () => { T.open = null; go(viewLogin); };
  document.getElementById("rf").onclick = async () => { await loadTeacher(); renderTeacher(); toast("تم تحديث النتائج"); };
  const sq = document.getElementById("sq");
  sq.oninput = () => { T.q = sq.value; const pos = sq.selectionStart; renderTeacher(); const n = document.getElementById("sq"); n.focus(); n.setSelectionRange(pos, pos); };
  document.getElementById("sc").onchange = e => { T.cls = e.target.value; renderTeacher(); };
  document.getElementById("ss").onchange = e => { T.sort = e.target.value; renderTeacher(); };
  document.getElementById("csv").onclick = () => exportCSV(list);
  document.querySelectorAll(".stu .row").forEach(b => b.onclick = () => { T.open = T.open === b.dataset.id ? null : b.dataset.id; renderTeacher(); });
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => resetStudent(b.dataset.reset));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => deleteStudent(b.dataset.del));
}
function accClass(a){ return a === null ? "n" : a >= 80 ? "h" : a >= 60 ? "m" : "l"; }
function stuHtml({ r, S }){
  const open = T.open === r.id;
  let det = "";
  if (open){
    let cells = "";
    for (let i = 0; i < N; i++){ const s = stSummary(r, i); const c = s.done ? "d" : (s.started ? "p" : ""); cells += '<div class="cell ' + c + '" title="' + esc(STATIONS[i].t) + '"><b>' + ar(i + 1) + "</b>" + (s.started ? ar(s.first) + "/" + ar(s.n) : "—") + (s.wrong ? '<br><small style="color:#9c2438">✕' + ar(s.wrong) + "</small>" : "") + "</div>"; }
    det = '<div class="det"><div style="font-size:13px;color:var(--muted)">كل خانة = محطة: (الإجابات الصحيحة من أول محاولة / عدد أسئلة المحطة)، وعلامة ✕ تعني محاولات خاطئة.</div><div class="grid25">' + cells + "</div>" +
      '<div style="font-size:14px;margin-bottom:10px">إجمالي المحاولات الخاطئة: <b>' + ar(S.wrong) + "</b> · آخر نشاط: <b>" + fmtDate(r.updated) + "</b> · أول دخول: " + fmtDate(r.created) + "</div>" +
      '<div class="acts"><button class="btn ghost sm" data-reset="' + r.id + '">إعادة تعيين التقدّم</button><button class="btn danger sm" data-del="' + r.id + '">حذف الطالبة</button></div></div>';
  }
  return '<div class="stu"><button class="row" data-id="' + r.id + '" aria-expanded="' + open + '"><span class="nm"><b>' + esc(r.name) + '</b><small class="cls-s">' + esc(r.cls) + '</small></span><span class="cls">' + esc(r.cls) + "</span>" +
    '<span class="pr"><small>' + ar(S.done) + " من " + ar(N) + " محطة · " + ar(S.solved) + " سؤالًا</small><div class=\"mini\"><i style=\"width:" + Math.round(S.solved / TOTAL_Q * 100) + '%"></i></div></span>' +
    '<span class="acc ' + accClass(S.acc) + '">' + (S.acc === null ? "—" : ar(S.acc) + "٪") + "</span></button>" + det + "</div>";
}
const fmtDate = t => { try { return new Date(t).toLocaleString("ar-EG", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); } catch(e){ return ""; } };
async function resetStudent(id){
  const r = T.rows.find(x => x.id === id); if (!r || !confirm("إعادة تعيين تقدّم «" + r.name + "» من البداية؟")) return;
  r.st = {}; r.rs = Date.now(); await saveRec(r); renderTeacher();
}
async function deleteStudent(id){
  const r = T.rows.find(x => x.id === id); if (!r || !confirm("حذف «" + r.name + "» نهائيًا مع نتائجها؟")) return;
  localDel(id); if (remoteOn()) { try { await sb.del(id); } catch(e){ toast("تعذّر الحذف من قاعدة البيانات"); } }
  T.rows = T.rows.filter(x => x.id !== id); T.open = null; renderTeacher();
}
function exportCSV(list){
  const head = ["الاسم", "الفصل", "المحطات المنجزة", "الأسئلة المحلولة", "الصحيحة من أول محاولة", "المحاولات الخاطئة", "الإتقان %", "آخر نشاط"];
  for (let i = 0; i < N; i++) head.push("م" + (i + 1));
  const rows = list.map(({ r, S }) => [r.name, r.cls, S.done, S.solved, S.first, S.wrong, S.acc === null ? "" : S.acc, new Date(r.updated).toISOString().slice(0, 16).replace("T", " ")].concat(Array.from({ length: N }, (_, i) => { const s = stSummary(r, i); return s.started ? s.first + "/" + s.n : ""; })));
  const csv = "\ufeff" + [head].concat(rows).map(l => l.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "نتائج-للعلا-ننافس.csv"; document.body.appendChild(a); a.click(); a.remove();
}

/* ===================== البداية ===================== */
(async function init(){
  const id = ls.get(KEY_ME);
  if (id) {
    const local = localAll()[id] || null; let remote = null;
    if (remoteOn()) { try { remote = await sb.get(id); } catch(e){} }
    const rec = mergeRec(remote, local);
    if (rec) { if (remote) rec.pin = remote.pin; me = rec; if (remoteOn()) saveRec(rec); else syncState = "local"; return viewMap(); }
  }
  viewLogin();
})();
</script>
